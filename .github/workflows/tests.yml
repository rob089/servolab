name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"     # the oldest supported version
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-extras
      - name: Test (no hardware needed)
        run: uv run pytest -q

  core-only:
    # What a Raspberry Pi installs: servolab without the optional packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - name: Install the core only
        run: uv venv && uv pip install .
      - name: Simulated motors, network port and server work without extras
        run: |
          uv run --no-project python -c "
          import threading, time, servolab
          from servolab.server import BusServer
          from servolab.ports.sim_port import SimPort
          server = BusServer(SimPort((1, 2)), host='127.0.0.1', tcp_port=0)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          bus = servolab.connect(f'tcp://127.0.0.1:{server.address[1]}')
          assert sorted(bus.motors) == [1, 2], bus.motors
          bus.disconnect()
          time.sleep(0.5)                  # let the server log the disconnect before Python exits
          server.shutdown()
          print('core-only OK')
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build wheel and sdist
        run: uv build
      - name: Check package contents
        run: |
          python -m zipfile -l dist/*.whl | grep -q "servolab/robots/so102/so102.xml"
          python -m zipfile -l dist/*.whl | grep -q "servolab/scope/assets/logo.svg"
          python -m zipfile -l dist/*.whl | grep -q "servolab/docs/getting_started.md"
