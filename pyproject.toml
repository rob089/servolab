[project]
name = "servolab"
dynamic = ["version"]      # read from __version__ in src/servolab/__init__.py
description = "Control Feetech serial bus servos (STS3215 and friends) from Python - made for teaching robotics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/servolab/_sdk/LICENSE"]
authors = [{ name = "Robin Schregle" }]
keywords = ["feetech", "sts3215", "servo", "robotics", "teaching", "so-101", "mujoco"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
# The core only needs numpy and pyserial, e.g. on a Raspberry Pi that shares its bus
# over the network. Laptops for teaching install everything: servolab[all].
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/rob089/servolab"
Documentation = "https://rob089.github.io/servolab/"
Issues = "https://github.com/rob089/servolab/issues"
Changelog = "https://github.com/rob089/servolab/blob/main/CHANGELOG.md"

[project.scripts]
servoscope = "servolab.scope:main"
servolab-server = "servolab.server:main"

[project.optional-dependencies]
scope = ["nicegui>=3.17.1"]                              # ServoScope web app
plot = ["matplotlib>=3.7", "rerun-sdk>=0.38.1"]          # Recorder.plot(), LivePlot
kinematics = ["roboticstoolbox-python>=1.4.4"]           # used in the course exercises
sim = ["mujoco>=3.3", "rerun-sdk>=0.38.1"]               # simulated robots with 3D view
all = ["servolab[scope,plot,kinematics,sim]"]

[dependency-groups]
dev = [
    "pytest>=8",
]
docs = [                     # the website: uv run --group docs mkdocs serve
    "mkdocs>=1.6,<2",          # MkDocs 2 drops plugins and themes
    "mkdocs-material>=9.7",
    "mkdocs-gen-files>=0.6",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/servolab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/servolab"]

[tool.hatch.build.targets.sdist]
exclude = ["firmware/", ".github/"]
