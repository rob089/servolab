; Firmware for the Feetech bus IMU node: Seeed XIAO nRF52840 Sense.
;
; The XIAO is not in the official nordicnrf52 platform, so we use Max Gerhardt's
; fork that adds it (Seeed's Adafruit-based Arduino core, UF2/nrfutil upload over USB).
; Build: pio run    Upload: pio run -t upload

[platformio]
default_envs = xiao_sense

[env:xiao_sense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 1000000
; The UART receive buffer is 64 bytes by default. A SYNC_WRITE to many servos
; is longer and arrives while we may be busy reading the IMU chip.
build_flags = -DSERIAL_BUFFER_SIZE=512
; The platform's default GCC 7 is an Intel-only binary (fails on Apple Silicon
; without Rosetta). GCC 12.3 has native arm64 builds.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0

; Debug build for wiring problems: the USB port prints what arrives on the
; bus (bytes, packets, D7 level) instead of speaking the protocol.
;   pio run -e bus_debug -t upload    then    pio device monitor -e bus_debug
[env:bus_debug]
extends = env:xiao_sense
build_flags = ${env:xiao_sense.build_flags} -DBUS_DEBUG
