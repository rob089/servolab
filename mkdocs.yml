site_name: servolab
site_description: Control Feetech serial bus servos (STS3215 and friends) from Python - made for teaching robotics.
site_url: https://rob089.github.io/servolab/
repo_url: https://github.com/rob089/servolab
repo_name: rob089/servolab
exclude_docs: |
  gen_pages.py

copyright: MIT License · made for the robotics seminar of the TUM Chair of Microtechnology and Medical Device Technology (MiMed)

theme:
  name: material
  language: en
  logo: assets/favicon.png
  favicon: assets/favicon.png
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - privacy             # fonts and other external files are served from this site, not from Google
  - gen-files:
      scripts:
        - docs/gen_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guides:
      - Getting started: guides/getting_started.md
      - Modes & units: guides/modes_and_units.md
      - IMU: guides/imu.md
      - Robots over WiFi: guides/network.md
      - Simulation: guides/simulation.md
      - Troubleshooting: guides/troubleshooting.md
  - ServoScope: servoscope.md
  - Hardware: hardware.md
  - Reference:
      - Python API: api.md
      - Registers: registers.md
      - Examples: examples.md
  - Development: development.md
  - Changelog: changelog.md
